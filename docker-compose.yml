services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskboard}
      POSTGRES_USER: ${POSTGRES_USER:-taskboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskboard}
    volumes:
      - taskboard_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      ADDRESS: ":8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-taskboard}:${POSTGRES_PASSWORD:-taskboard}@db:5432/${POSTGRES_DB:-taskboard}?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      STUN_URLS: ${STUN_URLS:-}
      TURN_HOST: ${TURN_HOST:-}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_SECRET: ${TURN_SECRET:-}
    ports:
      - "${API_PORT:-18080}:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.raccoon-api.rule=Host(`api.raccoonsoftwares.com`)"
      - "traefik.http.routers.raccoon-api.entrypoints=websecure"
      - "traefik.http.routers.raccoon-api.tls=true"
      - "traefik.http.routers.raccoon-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.raccoon-api.service=raccoon-api"
      - "traefik.http.services.raccoon-api.loadbalancer.server.port=8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy

volumes:
  taskboard_postgres_data:
